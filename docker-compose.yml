services:
  backend:
    image: yash1508/grc-backend:latest
    pull_policy: always
    container_name: grc-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./extracted:/app/extracted
      - ./output:/app/output
  frontend:
    image: yash1508/grc-frontend:latest
    pull_policy: always
    container_name: grc-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
